{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .loading-text {
            display: none;
            color: #6c757d;
            font-style: italic;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .preselected-service {
            background-color: #e3f2fd !important;
            font-weight: 500;
        }
        .alert {
            display: none;
            margin-top: 1rem;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="form-container">
            <h2 class="text-center mb-4">Book Your Training Program</h2>

            <!-- Error Alert -->
            <div id="error-alert" class="alert alert-danger" role="alert"></div>

            <form method="POST">
                {% csrf_token %}
                
                <!-- Service Selection -->
                <div class="mb-4">
                    <label for="service" class="form-label fw-bold">Select Service</label>
                    <select class="form-select form-select-lg" name="service" id="service" required>
                        <option value="">Choose a Service</option>
                        {% for service in services %}
                            <option value="{{ service.id }}" 
                                {% if preselected_service and service.id == preselected_service.id %}selected class="preselected-service"{% endif %}>
                                {{ service.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Trainer Selection -->
                <div class="mb-4">
                    <label for="trainer" class="form-label fw-bold">Select Trainer</label>
                    <select class="form-select form-select-lg" name="trainer" id="trainer" required>
                        <option value="">Choose a Trainer</option>
                        {% for trainer in trainers %}
                            <option value="{{ trainer.id }}">
                                {{ trainer.name }} - 
                                {% if trainer.available_time_slots %}
                                    {{ trainer.available_time_slots|join:", " }}
                                {% else %}
                                    Flexible hours
                                {% endif %}
                            </option>
                        {% endfor %}
                    </select>
                    <div class="loading-text mt-2">Loading available trainers...</div>
                </div>

                <!-- Time Slot Selection -->
                <div class="mb-4">
                    <label for="time_slot" class="form-label fw-bold">Select Time Slot</label>
                    <select class="form-select form-select-lg" name="time_slot" id="time_slot" required>
                        <option value="">Choose a Time Slot</option>
                    </select>
                </div>
                
                <!-- Package Selection -->
                <div class="mb-4">
                    <label for="package" class="form-label fw-bold">Package Duration</label>
                    <select class="form-select form-select-lg" name="package" id="package" required>
                        <option value="">Select Package</option>
                        <option value="1" data-duration="30">1 Month</option>
                        <option value="3" data-duration="90">3 Months</option>
                        <option value="6" data-duration="180">6 Months</option>
                        <option value="12" data-duration="360">12 Months</option>
                    </select>
                </div>
                
                <!-- Date Selection -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="start_date" class="form-label fw-bold">Start Date</label>
                        <input type="date" class="form-control form-control-lg" 
                               id="start_date" name="start_date" required>
                    </div>
                    <div class="col-md-6">
                        <label for="end_date" class="form-label fw-bold">End Date</label>
                        <input type="date" class="form-control form-control-lg" 
                               id="end_date" name="end_date" readonly>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Confirm Booking</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const serviceSelect = document.getElementById('service');
            const trainerSelect = document.getElementById('trainer');
            const timeSlotSelect = document.getElementById('time_slot');
            const packageSelect = document.getElementById('package');
            const startDateInput = document.getElementById('start_date');
            const endDateInput = document.getElementById('end_date');
            const loadingText = document.querySelector('.loading-text');
            const errorAlert = document.getElementById('error-alert');

            // Set default start date to tomorrow
            const today = new Date();
            today.setDate(today.getDate() + 1);
            startDateInput.min = today.toISOString().split('T')[0];
            startDateInput.value = startDateInput.min;

            // Load trainers if service is preselected
            {% if preselected_service %}
                if ({{ preselected_service.id|default:0 }} > 0) {
                    fetchTrainers({{ preselected_service.id }});
                }
            {% endif %}

            // Service change handler
            serviceSelect.addEventListener('change', function() {
                const serviceId = this.value;
                if (serviceId) {
                    fetchTrainers(serviceId);
                } else {
                    resetTrainers();
                }
            });

            // Trainer change handler
            trainerSelect.addEventListener('change', function() {
                const trainerId = this.value;
                const selectedDate = startDateInput.value;
                if (trainerId && selectedDate) {
                    fetchAvailableSlots(trainerId, selectedDate);
                } else {
                    resetTimeSlots();
                }
            });

            // Date change handler
            startDateInput.addEventListener('change', function() {
                const trainerId = trainerSelect.value;
                const selectedDate = this.value;
                if (trainerId && selectedDate) {
                    fetchAvailableSlots(trainerId, selectedDate);
                } else {
                    resetTimeSlots();
                }
            });

            // Date calculation handler
            function updateEndDate() {
                const duration = packageSelect.selectedOptions[0]?.dataset.duration;
                const startDate = new Date(startDateInput.value);
                
                if (duration && startDate) {
                    const endDate = new Date(startDate);
                    endDate.setDate(endDate.getDate() + parseInt(duration));
                    endDateInput.value = endDate.toISOString().split('T')[0];
                } else {
                    endDateInput.value = '';
                }
            }

            // Fetch trainers function
            function fetchTrainers(serviceId) {
                loadingText.style.display = 'block';
                trainerSelect.disabled = true;
                
                fetch(`/get_trainers/${serviceId}/`)
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.json();
                    })
                    .then(data => {
                        trainerSelect.innerHTML = '<option value="">Select Trainer</option>';
                        data.trainers.forEach(trainer => {
                            const option = document.createElement('option');
                            option.value = trainer.id;
                            option.textContent = trainer.name;  // Only show trainer name
                            trainerSelect.appendChild(option);
                        });
                    })
                    .catch(error => {
                        showError(`Failed to load trainers: ${error.message}`);
                        console.error('Error:', error);
                        trainerSelect.innerHTML = '<option value="">Error loading trainers</option>';
                    })
                    .finally(() => {
                        loadingText.style.display = 'none';
                        trainerSelect.disabled = false;
                    });
            }

            // Fetch available time slots function
            function fetchAvailableSlots(trainerId, selectedDate) {
                fetch(`/get_available_slots/${trainerId}/?date=${selectedDate}`)
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.json();
                    })
                    .then(data => {
                        timeSlotSelect.innerHTML = '<option value="">Choose a Time Slot</option>';
                        if (data.available_slots && data.available_slots.length > 0) {
                            // Convert time slots to proper format
                            const formattedSlots = data.available_slots.map(slot => {
                                return slot.toLowerCase().replace(/\s+/g, '_');
                            });
                            
                            formattedSlots.forEach(slot => {
                                const option = document.createElement('option');
                                option.value = slot;
                                option.textContent = slot.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                                timeSlotSelect.appendChild(option);
                            });
                        } else {
                            timeSlotSelect.innerHTML = '<option value="">No slots available</option>';
                        }
                    })
                    .catch(error => {
                        showError(`Failed to load time slots: ${error.message}`);
                        console.error('Error fetching time slots:', error);
                        timeSlotSelect.innerHTML = '<option value="">Error loading time slots</option>';
                    });
            }

            // Reset trainers function
            function resetTrainers() {
                trainerSelect.innerHTML = '<option value="">Select Trainer</option>';
                resetTimeSlots();
            }

            // Reset time slots function
            function resetTimeSlots() {
                timeSlotSelect.innerHTML = '<option value="">Choose a Time Slot</option>';
            }

            // Show error message
            function showError(message) {
                errorAlert.textContent = message;
                errorAlert.style.display = 'block';
                setTimeout(() => errorAlert.style.display = 'none', 5000);
            }

            // Event listeners
            packageSelect.addEventListener('change', updateEndDate);
            startDateInput.addEventListener('change', updateEndDate);
        });
    </script>
</body>
</html>
