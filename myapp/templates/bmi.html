{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator with Gauge Meter</title>

    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e0f7fa;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .nav-bar {
            display: flex;
            width: 100%;
            justify-content: start;
        }
        .logo {
            margin: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center; /* Center the logo vertically */
            justify-content: center; /* Center the logo horizontally */
            height: 100%; /* Make sure the logo container takes up full height of the navbar */
        }
        .logo img {
            width:120px;
            object-fit: contain;
        }
        .container {
            display: flex;
            width: 80%;
            max-width: 900px;
            background-color: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            align-items: center;
        }

        /* Gauge Container */
        .gauge-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gauge-background {
            width: 300px;
            height: auto;
        }

        .gauge-arrow {
            position: absolute;
            bottom: 10%; /* Adjusted to align needle properly */
            left: 50%;
            width: 8px;
            height: 100px;
            background-color: rgb(0, 0, 0);
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-45deg); /* Default to underweight */
            transition: transform 0.5s ease-in-out;
        }

        /* BMI Form Styling */
        .bmi-form-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        form {
            width: 100%;
            max-width: 300px;
        }

        form label {
            font-size: 18px;
            color: #00796b;
            margin: 10px 0 5px;
        }

        form input {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            border-radius: 8px;
            border: 2px solid #00796b;
            text-align: center;
        }

        form button {
            background-color: #00796b;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }

        form button:hover {
            background-color: #004d40;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #00796b;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="nav-bar">
        <div class="logo">
            <a href="{% url 'homepage' %}"><img src="{% static 'images/logo.png' %}" alt=""></a>
        </div>
    </div>

    <div class="container">
        <!-- Gauge Meter on the Left -->
        <div class="gauge-container">
            <img src="{% static 'images/BMI.png' %}" alt="BMI Gauge" class="gauge-background">
            <div class="gauge-arrow" id="gaugeArrow"></div>
        </div>

        <!-- BMI Form on the Right -->
        <div class="bmi-form-container">
            <h1>BMI Calculator</h1>

            <div class="profile-info">
                <h2>Profile Information</h2>
                <p><strong>Name:</strong> {{ profile.user.first_name }} {{ profile.user.last_name }}</p>
                <p><strong>Height:</strong> {{ profile.height }} cm</p>
                <p><strong>Weight:</strong> {{ profile.weight }} kg</p>
                <p><strong>Gender:</strong> {{ profile.gender }}</p>
    
            <form id="bmiForm">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" required>

                <label for="height">Height (cm):</label>
                <input type="number" id="height" required>

                <button type="button" onclick="calculateBMI()">Calculate</button>
            </form>

            <div class="result" id="bmiResult"></div>
        </div>
    </div>

    <script>
        function calculateBMI() {
            let weight = parseFloat(document.getElementById("weight").value);
            let height = parseFloat(document.getElementById("height").value) / 100;

            if (!weight || !height) {
                alert("Please enter valid weight and height values.");
                return;
            }

            let bmi = weight / (height * height);
            let category = "";
            let rotation = 0;

            if (bmi < 18.5) {
                category = "Underweight";
                rotation = -45;
            } else if (bmi >= 18.5 && bmi < 25) {
                category = "Normal";
                rotation = -20;
            } else if (bmi >= 25 && bmi < 30) {
                category = "Overweight";
                rotation = 10;
            } else if (bmi >= 30 && bmi < 35) {
                category = "Obese";
                rotation = 40;
            } else {
                category = "Extremely Obese";
                rotation = 70;
            }

            document.getElementById("bmiResult").innerHTML = `Your BMI: ${bmi.toFixed(2)}<br>Classification: ${category}`;
            document.getElementById("gaugeArrow").style.transform = `translateX(-50%) rotate(${rotation}deg)`;
        }
    </script>

</body>
</html>
